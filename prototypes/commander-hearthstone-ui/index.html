<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander Hearthstone UI Prototype</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#10151b;color:#eee;font-family:Inter,system-ui,Arial,sans-serif;overflow:hidden}
button{font:inherit}.game{height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 45%,#304334 0,#18251d 38%,#0e1418 80%)}
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#11161b;border-bottom:1px solid #39434b;box-shadow:0 3px 12px #0008;z-index:10}
.logo{font-weight:800;letter-spacing:.8px}.turn{color:#a9c7a5}.end{background:#d6a73a;color:#16120a;border:0;border-radius:8px;padding:9px 18px;font-weight:800;cursor:pointer}
.table{position:relative;flex:1;min-height:0}
.player{position:absolute;background:#111923d9;border:1px solid #59656f;border-radius:12px;padding:8px 12px;box-shadow:0 8px 22px #0008;z-index:5}
.p2{top:10px;left:50%;transform:translateX(-50%)} .p3{left:12px;top:50%;transform:translateY(-50%)} .p4{right:12px;top:50%;transform:translateY(-50%)} .you{bottom:8px;left:50%;transform:translateX(-50%);min-width:310px;text-align:center}
.name{font-weight:800}.life{font-size:20px;font-weight:900}.commander{font-size:12px;color:#c9d2d8}
.arena{position:absolute;left:10%;right:10%;top:19%;bottom:28%;border:1px solid #63796999;border-radius:28px;background:linear-gradient(#29402d88,#1c2e2388);box-shadow:inset 0 0 50px #0008,0 10px 35px #0006}
.zone{position:absolute;display:flex;gap:8px;align-items:center}.opponent-board{top:12%;left:15%;right:15%;height:30%;justify-content:center}.your-board{bottom:9%;left:10%;right:10%;height:38%;justify-content:center;align-items:flex-end}
.cards{display:flex;gap:10px;align-items:center;justify-content:center;min-height:90px}
.card{width:82px;height:116px;border-radius:9px;border:2px solid #b9c2c6;background:linear-gradient(150deg,#ded6b9,#9e967e);color:#171717;box-shadow:0 7px 15px #000b;position:relative;cursor:pointer;transition:.16s transform,.16s filter;overflow:hidden;flex:none}
.card:hover{transform:translateY(-12px) scale(1.04);filter:brightness(1.1);z-index:20}.card .ct{font-size:10px;font-weight:900;padding:5px 6px;background:#eee9d8}.card .art{height:55px;background:linear-gradient(135deg,#6f8273,#2c4031);margin:3px 5px;border-radius:5px}.card .rules{font-size:7px;line-height:1.15;padding:3px 6px}.card .pt{position:absolute;bottom:3px;right:5px;font-size:10px;font-weight:900}
.hand{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:25%;display:flex;align-items:flex-end;justify-content:center;gap:4px;z-index:8}.hand .card{width:102px;height:142px;margin-bottom:-12px}.hand .card:hover{margin-bottom:16px}
.status{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:9px 15px;border-radius:20px;background:#0b0f12c9;border:1px solid #67736b;color:#dce7df;font-size:13px;z-index:7;pointer-events:none}
.mana{display:flex;gap:5px;justify-content:center;margin-top:3px}.gem{width:17px;height:17px;border-radius:50%;background:#6f91bd;border:1px solid #d4e1f2;box-shadow:0 0 7px #75a4d899}
.controls{position:absolute;right:16px;bottom:14px;display:flex;gap:7px;z-index:20}.ctrl{background:#252e35e8;color:#eee;border:1px solid #59646b;border-radius:7px;padding:7px 10px;cursor:pointer}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}
.bigcard{width:310px;height:435px;border:3px solid #c9d0d2;border-radius:15px;background:#ddd4b8;color:#151515;box-shadow:0 20px 70px #000;overflow:hidden}.bigcard .ct{font-size:19px;font-weight:900;padding:11px 14px;background:#eee8d5}.bigcard .art{height:175px;margin:8px;background:linear-gradient(135deg,#718c77,#253c2a);border-radius:8px}.bigcard .text{padding:10px 15px;font-size:14px;line-height:1.4}.close{margin:14px;background:#222;color:#fff;border:0;padding:9px 16px;border-radius:7px;cursor:pointer}
.toast{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:#0a0e12e8;border:1px solid #667;color:#fff;padding:9px 15px;border-radius:9px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1}
@media(max-width:900px){.arena{left:4%;right:4%}.card{width:65px;height:94px}.hand .card{width:76px;height:106px}.p3,.p4{display:none}}
</style></head><body>
<div class="game"><div class="topbar"><div class="logo">COMMANDER <span style="color:#c8a34a">TABLE</span></div><div class="turn" id="turnText">Your turn • Main Phase</div><button class="end" id="endTurn">END TURN</button></div>
<div class="table"><div class="toast" id="toast"></div>
<div class="player p2"><div class="name">Maya</div><div class="life">40 ❤️</div><div class="commander">Atraxa, Praetors' Voice</div></div>
<div class="player p3"><div class="name">Jordan</div><div class="life">40 ❤️</div><div class="commander">The Ur-Dragon</div></div>
<div class="player p4"><div class="name">Sam</div><div class="life">40 ❤️</div><div class="commander">Meren of Clan Nel Toth</div></div>
<div class="arena"><div class="zone opponent-board"><div class="cards" id="opponentCards"></div></div><div class="status" id="status">Main Phase • 7 cards in hand</div><div class="zone your-board"><div class="cards" id="boardCards"></div></div></div>
<div class="player you"><div class="name">YOU</div><div class="life" id="life">40 ❤️</div><div class="commander">Teval, the Balanced Scale • Commander Damage: 0</div><div class="mana" id="mana"></div></div>
<div class="hand" id="hand"></div><div class="controls"><button class="ctrl" onclick="drawCard()">Draw</button><button class="ctrl" onclick="untap()">Untap</button><button class="ctrl" onclick="openPile('Graveyard')">🪦 Graveyard</button><button class="ctrl" onclick="openPile('Exile')">✨ Exile</button></div></div></div>
<div class="modal" id="modal"><div style="text-align:center"><div class="bigcard"><div class="ct" id="modalTitle">Card</div><div class="art"></div><div class="text" id="modalText"></div></div><button class="close" onclick="closeModal()">Close</button></div></div>
<script>
const cards=[{name:"Sol Ring",mana:"1",type:"Artifact",text:"{T}: Add {C}{C}.",pt:""},{name:"Command Tower",mana:"",type:"Land",text:"{T}: Add one mana of any color in your commander's color identity.",pt:""},{name:"Cultivate",mana:"2G",type:"Sorcery",text:"Search your library for up to two basic land cards. Put one onto the battlefield tapped and the other into your hand.",pt:""},{name:"Sakura-Tribe Elder",mana:"1G",type:"Creature",text:"Sacrifice Sakura-Tribe Elder: Search your library for a basic land card and put it onto the battlefield tapped.",pt:"1/1"},{name:"Beast Within",mana:"2G",type:"Instant",text:"Destroy target permanent. Its controller creates a 3/3 green Beast creature token.",pt:""},{name:"Swiftfoot Boots",mana:"2",type:"Artifact",text:"Equipped creature has hexproof and haste. Equip {1}.",pt:""},{name:"Teval",mana:"4BG",type:"Legendary Creature",text:"Your graveyard matters. This prototype treats Teval as your commander.",pt:"5/5"},{name:"Forest",mana:"",type:"Basic Land — Forest",text:"{T}: Add {G}.",pt:""}];
let hand=[0,1,2,3,4,5,6],board=[],opponent=[3,6],life=40,mana=6,turn=1;
function cardHTML(c,source,i){return `<div class="card" data-source="${source}" data-index="${i}"><div class="ct">${c.name}<span style="float:right">${c.mana}</span></div><div class="art"></div><div class="rules">${c.type}<br><br>${c.text}</div>${c.pt?`<div class="pt">${c.pt}</div>`:""}</div>`}
function render(){handEl=document.getElementById("hand");handEl.innerHTML=hand.map((id,i)=>cardHTML(cards[id],"hand",i)).join("");document.getElementById("boardCards").innerHTML=board.map((id,i)=>cardHTML(cards[id],"board",i)).join("");document.getElementById("opponentCards").innerHTML=opponent.map((id,i)=>cardHTML(cards[id],"opp",i)).join("");document.getElementById("life").textContent=life+" ❤️";document.getElementById("status").textContent=`Main Phase • ${hand.length} cards in hand`;document.getElementById("mana").innerHTML=Array.from({length:mana},()=>'<span class="gem"></span>').join("");document.querySelectorAll(".card").forEach(el=>{el.onclick=()=>inspect(+el.dataset.index,el.dataset.source);el.ondblclick=()=>play(+el.dataset.index,el.dataset.source)})}
function inspect(i,source){const ids={hand,board,opp:opponent}[source],c=cards[ids[i]];document.getElementById("modalTitle").textContent=c.name+" • "+c.mana;document.getElementById("modalText").innerHTML=`<b>${c.type}</b><br><br>${c.text}${c.pt?`<br><br><b>${c.pt}</b>`:""}`;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function play(i,source){if(source!=="hand")return;const id=hand[i],c=cards[id],cost=c.mana.length||0;if(c.type.includes("Land")){board.push(id);hand.splice(i,1);toast("Land played")}else if(mana>=Math.min(cost,3)){mana-=Math.min(cost,3);board.push(id);hand.splice(i,1);toast(c.name+" cast")}else{return toast("Not enough mana")}render()}
function drawCard(){hand.push(Math.floor(Math.random()*cards.length));toast("Card drawn");render()}
function untap(){mana=6;toast("Permanents untapped • mana refreshed");render()}
function openPile(name){document.getElementById("modalTitle").textContent=name;document.getElementById("modalText").textContent=name+" is empty in this UI prototype.";document.getElementById("modal").classList.add("open")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1200)}
document.getElementById("endTurn").onclick=()=>{turn++;mana=6;document.getElementById("turnText").textContent=`Your turn ${turn} • Main Phase`;drawCard();toast("Turn advanced")};render();
</script></body></html>
